name: Build and Release Banewfn

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-manual:
    name: Build manual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install manual build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             pandoc             texlive-xetex             texlive-lang-chinese             texlive-latex-recommended             texlive-fonts-recommended             fonts-noto-core             fonts-noto-cjk             fonts-noto-mono

      - name: Build manual PDF
        run: ./docs/build.sh

      - name: Upload manual artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          if-no-files-found: error
          path: docs/out/BaneWfn_Project_Manual_zh.pdf

  build-linux-release:
    name: Build Linux release CPack
    runs-on: ubuntu-latest
    needs: build-manual

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download manual artifact
        uses: actions/download-artifact@v4
        with:
          name: manual-pdf
          path: docs/out

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             cmake             make             g++

      - name: Run Linux preset workflow
        run: cmake --workflow --preset linux-release

      - name: Show Linux release files
        run: find release/linux-release -maxdepth 2 -type f | sort

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: release/linux-release/*.sh

  build-windows-release:
    name: Build Windows release CPack
    runs-on: ubuntu-latest
    needs: build-manual

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download manual artifact
        uses: actions/download-artifact@v4
        with:
          name: manual-pdf
          path: docs/out

      - name: Install Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             cmake             make             zip             mingw-w64             g++-mingw-w64-x86-64             gcc-mingw-w64-x86-64             binutils-mingw-w64-x86-64

      - name: Run Windows preset workflow
        run: cmake --workflow --preset windows-release

      - name: Stage Windows installer tree
        run: |
          set -euxo pipefail
          STAGE_DIR=release/windows-release/stage
          rm -rf "$STAGE_DIR"
          cmake --install build/windows-release --prefix "$STAGE_DIR"
          test -f "$STAGE_DIR/banewfn.exe"
          test -d "$STAGE_DIR/conf"
          test -d "$STAGE_DIR/scripts"
          test -f "$STAGE_DIR/docs/out/BaneWfn_Project_Manual_zh.pdf"
          find "$STAGE_DIR" -maxdepth 4 -type f | sort

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: release/windows-release/*.zip

      - name: Upload Windows installer staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-stage
          if-no-files-found: error
          path: |
            release/windows-release/stage
            inno_setup
            src/resource/mothwfn.ico

  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-2022
    needs: build-windows-release

    steps:
      - name: Download Windows installer staging artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-stage
          path: staging

      - name: Show staging files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse staging

      - name: Resolve stage paths
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stageDir = Join-Path $PWD 'staging/release/windows-release/stage'
          $issPath = Join-Path $PWD 'staging/inno_setup/banewfn.iss'
          $outDir = Join-Path $PWD 'dist/windows-installer'

          if (-not (Test-Path (Join-Path $stageDir 'banewfn.exe'))) {
            throw "banewfn.exe not found under $stageDir"
          }
          if (-not (Test-Path (Join-Path $stageDir 'scripts'))) {
            throw "scripts directory not found under $stageDir"
          }
          if (-not (Test-Path (Join-Path $stageDir 'conf'))) {
            throw "conf directory not found under $stageDir"
          }
          if (-not (Test-Path (Join-Path $stageDir 'docs/out/BaneWfn_Project_Manual_zh.pdf'))) {
            throw "manual PDF not found under $stageDir/docs/out"
          }
          if (-not (Test-Path $issPath)) {
            throw "banewfn.iss not found at $issPath"
          }

          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          "stage_dir=$stageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "iss_path=$issPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "output_dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe'
          curl.exe -fL --retry 3 --retry-delay 2 -o innosetup.exe $url

          if ((Get-Item .\innosetup.exe).Length -lt 5MB) {
            throw 'Downloaded innosetup.exe is unexpectedly small.'
          }

          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          'C:\Program Files (x86)\Inno Setup 6' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          ISCC.exe "/DStageDir=${{ steps.stage.outputs.stage_dir }}" "/DOutputDir=${{ steps.stage.outputs.output_dir }}" "${{ steps.stage.outputs.iss_path }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: dist/windows-installer/*.exe

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-manual
      - build-linux-release
      - build-windows-release
      - build-windows-installer
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download manual artifact
        uses: actions/download-artifact@v4
        with:
          name: manual-pdf
          path: release-assets/manual

      - name: Download Linux release artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets/linux

      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows-installer

      - name: Prepare release metadata
        id: meta
        run: |
          tag="ci-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=Banewfn CI Release $tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          files: |
            release-assets/manual/BaneWfn_Project_Manual_zh.pdf
            release-assets/linux/*.sh
            release-assets/windows/*.zip
            release-assets/windows-installer/*.exe
