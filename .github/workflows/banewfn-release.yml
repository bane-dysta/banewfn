name: Build and Release Banewfn

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++

      - name: Configure tests
        run: |
          cmake -S . -B build/tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_STATIC=OFF \
            -DBANEWFN_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build/tests --parallel

      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure

  build-manual:
    name: Build manual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install manual build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-mono

      - name: Build manual PDF
        run: ./docs/build.sh

      - name: Upload manual artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          if-no-files-found: error
          path: docs/out/BaneWfn_Project_Manual_zh.pdf

  build-linux-release:
    name: Build Linux release CPack
    runs-on: ubuntu-latest
    needs:
      - build-manual
      - test-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download manual artifact
        uses: actions/download-artifact@v4
        with:
          name: manual-pdf
          path: docs/out

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++

      - name: Build Linux release with CMake presets
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
          cpack --preset linux-release

      - name: Show Linux release files
        run: find release/linux-release -maxdepth 2 -type f | sort

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: release/linux-release/*.sh

  build-windows-release:
    name: Build Windows release CPack
    runs-on: ubuntu-latest
    needs:
      - build-manual
      - test-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download manual artifact
        uses: actions/download-artifact@v4
        with:
          name: manual-pdf
          path: docs/out

      - name: Install Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            zip \
            mingw-w64 \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64

      - name: Build Windows release with CMake presets
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release
          cpack --preset windows-release

      - name: Stage Windows installer tree
        run: |
          set -euxo pipefail
          STAGE_DIR=release/windows-release/stage
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          cmake --install build/windows-release --prefix "$STAGE_DIR"

          find "$STAGE_DIR" -maxdepth 4 -type f | sort

      - name: Show Windows release files
        run: find release/windows-release -maxdepth 3 -type f | sort

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: release/windows-release/*.zip

      - name: Upload Windows installer staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-stage
          if-no-files-found: error
          path: |
            release/windows-release/stage/**
            inno_setup/**
            src/resource/mothwfn.ico

  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-2022
    needs: build-windows-release

    steps:
      - name: Download Windows installer staging artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-stage
          path: staging

      - name: Show staging files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse staging

      - name: Resolve stage paths
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path staging -Recurse -Filter banewfn.exe | Select-Object -First 1
          if (-not $exe) {
            throw 'banewfn.exe not found in staging artifact'
          }

          $iss = Get-ChildItem -Path staging -Recurse -Filter banewfn.iss | Select-Object -First 1
          if (-not $iss) {
            throw 'banewfn.iss not found in staging artifact'
          }

          $outDir = Join-Path $PWD 'dist/windows-installer'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          "stage_dir=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "iss_path=$($iss.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "output_dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe"
          curl.exe -fL --retry 3 --retry-delay 2 -o innosetup.exe $url

          if ((Get-Item .\innosetup.exe).Length -lt 5MB) {
            throw "Downloaded innosetup.exe is unexpectedly small."
          }

          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          ISCC.exe "/DStageDir=${{ steps.stage.outputs.stage_dir }}" "/DOutputDir=${{ steps.stage.outputs.output_dir }}" "${{ steps.stage.outputs.iss_path }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: dist/windows-installer/*.exe

  build-bwc-skill:
    name: Build BWC generator skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package BWC generator skill
        run: ./scripts/release/stage_skill.sh

      - name: Show skill package files
        run: find dist/skill -maxdepth 3 -type f | sort

      - name: Upload BWC generator skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: bwc-skill
          if-no-files-found: error
          path: |
            dist/skill/*.zip
            dist/skill/*.sha256

  build-vscode-extension:
    name: Build VS Code extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package VS Code extension
        working-directory: plugins/vsc/extension
        run: |
          set -euxo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          OUT_DIR="$GITHUB_WORKSPACE/dist/vscode-extension"
          mkdir -p "$OUT_DIR"
          npx --yes @vscode/vsce package --no-dependencies --out "$OUT_DIR/banewfn-syntax-${VERSION}.vsix"

      - name: Show VS Code extension files
        run: find dist/vscode-extension -maxdepth 2 -type f | sort

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          if-no-files-found: error
          path: dist/vscode-extension/*.vsix

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-manual
      - build-linux-release
      - build-windows-release
      - build-windows-installer
      - build-vscode-extension
      - build-bwc-skill
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show release assets
        run: find dist -maxdepth 3 -type f | sort

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ci-${{ github.run_id }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_TITLE: CI build #${{ github.run_number }}
          RELEASE_NOTES: |
            Automated CI release
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/linux-release/* \
            dist/windows-release/* \
            dist/windows-installer/* \
            dist/vscode-extension/* \
            dist/bwc-skill/* \
            dist/manual-pdf/* \
            --repo "$GH_REPO" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease
